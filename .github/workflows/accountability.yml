name: Accountability Bot

on:
  workflow_dispatch:

  # Uncomment and customize these schedules after configuring your bot.
  # Cron times are in UTC.
  #
  # schedule:
  #   - cron: "0 7 * * *"    # Morning
  #   - cron: "0 12 * * *"   # Midday
  #   - cron: "0 20 * * *"   # Evening

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send message
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          BOT_TIMEZONE: ${{ secrets.BOT_TIMEZONE }}
        run: |
          echo "This workflow is a template."
          echo "Configure your Discord secrets and schedule before running it."